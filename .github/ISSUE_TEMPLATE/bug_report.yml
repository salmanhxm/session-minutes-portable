name: Bug report
description: Report a reproducible problem without attaching real case data.
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version and Windows build
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach real legal documents, personal data, credentials, or confidential paths.
          required: true
