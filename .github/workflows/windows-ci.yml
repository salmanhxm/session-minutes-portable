name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { $errors; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Compile and test Python
        run: |
          python -m pip install --disable-pip-version-check lxml==6.1.0
          python -m compileall -q src tests
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build portable release
        shell: powershell
        run: .\build.ps1 -PythonExe (Get-Command python).Source
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SessionMinutesPortable-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
